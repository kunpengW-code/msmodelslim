apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: w3_g4_gptq_longcal
  score: 90
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"
w8a8_gptq: &w8a8_gptq
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "gptq"
    ext:
      percdamp: 0.01
default_w4a8_dynamic: &default_w4a8_dynamic
